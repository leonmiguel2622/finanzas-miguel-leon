<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - Finanzas Personales</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Crear cuenta</h1>
    <p class="sub">Empieza a controlar tus finanzas</p>
    <div id="msg" class="msg"></div>
    <form id="form-register">
      <div>
        <label>Nombre</label>
        <input type="text" id="nombre" required placeholder="Ana Torres" maxlength="100">
      </div>
      <div>
        <label>Correo</label>
        <input type="email" id="correo" required placeholder="ana@example.com">
      </div>
      <div>
        <label>Contraseña (mín 8)</label>
        <input type="password" id="contrasena" required minlength="8" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Crear cuenta</button>
    </form>
    <p class="link">¿Ya tienes cuenta? <a href="login.html">Ingresa aquí</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script>
const msgEl=document.getElementById('msg');
function showMsg(t,ty){msgEl.textContent=t;msgEl.className='msg show '+(ty==='error'?'error':'success');}
document.getElementById('form-register').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const payload={
    nombre:document.getElementById('nombre').value.trim(),
    correo:document.getElementById('correo').value.trim(),
    contrasena:document.getElementById('contrasena').value
  };
  const btn=e.target.querySelector('button'); btn.disabled=true; btn.textContent='Creando...';
  try{
    const data=await apiRegister(payload);
    showMsg('¡Cuenta creada! Redirigiendo al login...','success');
    setTimeout(()=>location.href='login.html',1200);
  }catch(err){
    showMsg(err.message,'error');
  }finally{btn.disabled=false; btn.textContent='Crear cuenta';}
});
</script>
</body>
</html>
