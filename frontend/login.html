<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar - Finanzas Personales</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Fondo cosmos morado - decorativo -->
<div class="stars-bg" aria-hidden="true">
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>
</div>

<main class="auth-wrap has-stars">
  <section class="auth-card" aria-labelledby="login-title">
    <header>
      <h1 id="login-title">Finanzas Personales</h1>
      <p class="sub">Ingresa a tu dashboard</p>
    </header>
    <div id="msg" class="msg" role="alert" aria-live="polite"></div>
    <form id="form-login">
      <fieldset>
        <legend class="sr-only">Credenciales de acceso</legend>
        <div>
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" required autocomplete="email" placeholder="ana@example.com">
        </div>
        <div>
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required placeholder="••••••••" minlength="8" autocomplete="current-password">
        </div>
      </fieldset>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
    <footer>
      <p class="link">¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
      <p class="auth-demo">Demo: ana@example.com / 12345678</p>
    </footer>
  </section>
</main>
<script src="js/api.js"></script>
<script>
const form = document.getElementById('form-login');
const msgEl = document.getElementById('msg');
function showMsg(text, type){
  msgEl.textContent=text;
  msgEl.className='msg show '+(type==='error'?'error':'success');
}
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const correo=document.getElementById('correo').value.trim();
  const contrasena=document.getElementById('contrasena').value;
  const btn=form.querySelector('button');
  btn.disabled=true; btn.textContent='Ingresando...';
  try{
    const data=await apiLogin(correo,contrasena);
    localStorage.setItem('id_usuario', data.id_usuario);
    localStorage.setItem('nombre', data.nombre);
    localStorage.setItem('correo', data.correo);
    showMsg('¡Bienvenido '+data.nombre+'! Redirigiendo...','success');
    setTimeout(()=> location.href='index.html', 800);
  }catch(err){
    showMsg(err.message||'Error al ingresar','error');
  }finally{
    btn.disabled=false; btn.textContent='Ingresar';
  }
});
</script>
</body>
</html>
